<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Guest Account | SYLVAN Countryside Retreats</title>
  <meta name="description"
    content="Join SYLVAN to reserve handpicked country homestays, unlock member rates, and save your favourite organic farmsteads.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            forest: {
              DEFAULT: '#254C3A',
              dark: '#193629',
              light: '#32634C'
            },
            sage: {
              DEFAULT: '#A8B89A',
              light: '#E4ECE0'
            },
            cream: '#F8F5EC',
            earth: '#8B6B4A',
            sand: '#E8DDCA',
            amberAccent: '#D4A373'
          },
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            display: ['Cormorant Garamond', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body
  class="bg-[#FAF8F2] dark:bg-[#0F1714] text-[#1C2420] dark:text-[#F3F7F5] min-h-screen flex flex-col items-center justify-center py-12 sm:py-16 px-4 sm:px-6 transition-colors duration-300 relative overflow-x-hidden overflow-y-auto">

  <!-- Background Ambience -->
  <div class="fixed inset-0 pointer-events-none opacity-40 dark:opacity-20 z-0">
    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1800&q=80"
      alt="Peaceful lakeside wooden cabin at sunrise" class="w-full h-full object-cover filter blur-md">
  </div>

  <!-- Card & Utilities Container -->
  <div class="relative z-10 w-full max-w-md my-auto flex flex-col">
    <!-- Top Utilities Bar (Positioned above card to prevent overlapping on mobile/tablet) -->
    <div class="flex items-center justify-end gap-2 mb-3 px-1">
      <button
        class="theme-toggle-btn w-9 h-9 rounded-full bg-white/80 dark:bg-stone-900/80 backdrop-blur-md text-stone-700 dark:text-stone-300 flex items-center justify-center shadow-xs hover:scale-105 transition-transform"
        title="Toggle Light/Dark Theme">
        <i data-lucide="moon" class="theme-icon-moon w-4 h-4"></i>
        <i data-lucide="sun" class="theme-icon-sun w-4 h-4 hidden"></i>
      </button>
      <button
        class="rtl-toggle-btn px-2.5 py-1 text-xs font-bold rounded-full bg-white/80 dark:bg-stone-900/80 backdrop-blur-md text-stone-700 dark:text-stone-300 hover:bg-stone-100 transition-colors shadow-xs"
        title="Toggle RTL Reading Direction">
        <span class="rtl-status-indicator">RTL</span>
      </button>
    </div>

    <!-- Centered Sign Up Card -->
    <div
      class="w-full bg-white dark:bg-[#15221D] p-6 sm:p-8 rounded-3xl border border-stone-200 dark:border-stone-800 shadow-2xl space-y-4">
    <!-- Logo & Header -->
    <div class="text-center space-y-2">
      <a href="index.html" class="inline-flex items-center gap-2.5 justify-center mb-1 group">
        <div
          class="w-10 h-10 rounded-2xl bg-forest dark:bg-emerald-800 text-white flex items-center justify-center shadow-md">
          <i data-lucide="trees" class="w-5 h-5 text-amberAccent"></i>
        </div>
        <span class="font-serif text-2xl font-bold tracking-tight text-forest dark:text-emerald-300">SYLVAN</span>
      </a>
      <h1 class="font-serif text-2xl font-bold text-stone-900 dark:text-stone-100">Create Guest Account</h1>
      <p class="text-xs text-stone-500">Join our community of mindful countryside and farmstead travellers.</p>
    </div>

    <!-- Sign Up Form (Single Column / One by One) -->
    <form id="signup-form" class="space-y-3.5">
      <div>
        <label
          class="block text-[11px] font-bold uppercase tracking-wider text-stone-600 dark:text-stone-400 mb-1">First
          Name</label>
        <input type="text" id="signup-fname" required placeholder="Julian"
          class="w-full px-3.5 py-2.5 rounded-2xl bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-xs focus:outline-hidden focus:border-forest text-stone-800 dark:text-stone-200 font-medium">
      </div>

      <div>
        <label
          class="block text-[11px] font-bold uppercase tracking-wider text-stone-600 dark:text-stone-400 mb-1">Last
          Name</label>
        <input type="text" id="signup-lname" required placeholder="Sterling"
          class="w-full px-3.5 py-2.5 rounded-2xl bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-xs focus:outline-hidden focus:border-forest text-stone-800 dark:text-stone-200 font-medium">
      </div>

      <div>
        <label
          class="block text-[11px] font-bold uppercase tracking-wider text-stone-600 dark:text-stone-400 mb-1">Email
          Address</label>
        <input type="email" id="signup-email" required placeholder="julian@example.com"
          class="w-full px-3.5 py-2.5 rounded-2xl bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-xs focus:outline-hidden focus:border-forest text-stone-800 dark:text-stone-200 font-medium">
      </div>

      <div>
        <label
          class="block text-[11px] font-bold uppercase tracking-wider text-stone-600 dark:text-stone-400 mb-1">Phone
          Number</label>
        <input type="tel" id="signup-phone" required placeholder="+1 (802) 555-0194"
          class="w-full px-3.5 py-2.5 rounded-2xl bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-xs focus:outline-hidden focus:border-forest text-stone-800 dark:text-stone-200 font-medium">
      </div>

      <div>
        <label
          class="block text-[11px] font-bold uppercase tracking-wider text-stone-600 dark:text-stone-400 mb-1">Password</label>
        <div class="relative">
          <input type="password" id="signup-password" required placeholder="At least 8 chars"
            class="w-full px-3.5 pr-10 py-2.5 rounded-2xl bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-xs focus:outline-hidden focus:border-forest text-stone-800 dark:text-stone-200 font-medium">
          <button type="button"
            class="btn-pwd-toggle absolute right-3.5 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-600"
            data-target="signup-password">
            <i data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div>
        <label
          class="block text-[11px] font-bold uppercase tracking-wider text-stone-600 dark:text-stone-400 mb-1">Confirm
          Password</label>
        <div class="relative">
          <input type="password" id="signup-confirm-password" required placeholder="Confirm password"
            class="w-full px-3.5 pr-10 py-2.5 rounded-2xl bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-xs focus:outline-hidden focus:border-forest text-stone-800 dark:text-stone-200 font-medium">
          <button type="button"
            class="btn-pwd-toggle absolute right-3.5 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-600"
            data-target="signup-confirm-password">
            <i data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div class="flex items-start gap-2 pt-1 text-xs text-stone-600 dark:text-stone-400">
        <input type="checkbox" id="terms-agree" required class="accent-forest mt-0.5 rounded">
        <label for="terms-agree" class="leading-relaxed">
          I agree to the <a href="contact.html"
            class="text-emerald-800 dark:text-emerald-400 underline font-semibold">Terms of Service</a>, Countryside
          Host Etiquette, and <a href="contact.html"
            class="text-emerald-800 dark:text-emerald-400 underline font-semibold">Privacy Policy</a>.
        </label>
      </div>

      <button type="submit" class="w-full btn-primary text-sm py-3.5 shadow-md">
        <i data-lucide="user-plus" class="w-4 h-4"></i> Create Free Account
      </button>
    </form>

    <!-- Social Authentication Options -->
    <div class="space-y-3 pt-2">
      <div class="flex items-center my-1">
        <div class="flex-grow border-t border-stone-200 dark:border-stone-800"></div>
        <span class="px-3 text-[11px] uppercase tracking-wider text-stone-400 shrink-0 font-medium">Or continue with</span>
        <div class="flex-grow border-t border-stone-200 dark:border-stone-800"></div>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <!-- Google -->
        <button type="button" onclick="handleSocialSignup('Google')"
          class="flex items-center justify-center p-3 rounded-2xl border border-stone-200 dark:border-stone-700 hover:bg-stone-50 dark:hover:bg-stone-800 transition-colors shadow-2xs"
          title="Sign up with Google" aria-label="Sign up with Google">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4"
              d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" />
            <path fill="#34A853"
              d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" />
            <path fill="#FBBC05"
              d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.04 0 12s.45 3.82 1.25 5.42l4.03-3.15z" />
            <path fill="#EA4335"
              d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" />
          </svg>
        </button>

        <!-- Apple -->
        <button type="button" onclick="handleSocialSignup('Apple')"
          class="flex items-center justify-center p-3 rounded-2xl border border-stone-200 dark:border-stone-700 hover:bg-stone-50 dark:hover:bg-stone-800 transition-colors shadow-2xs"
          title="Sign up with Apple" aria-label="Sign up with Apple">
          <svg class="w-4 h-4 fill-stone-900 dark:fill-white" viewBox="0 0 24 24">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.84c.62-.76 1.04-1.81.93-2.84-.9.04-1.99.6-2.64 1.36-.57.65-1.07 1.72-.93 2.73 1 .08 2.02-.49 2.64-1.25z"/>
          </svg>
        </button>

        <!-- Facebook -->
        <button type="button" onclick="handleSocialSignup('Facebook')"
          class="flex items-center justify-center p-3 rounded-2xl border border-stone-200 dark:border-stone-700 hover:bg-stone-50 dark:hover:bg-stone-800 transition-colors shadow-2xs"
          title="Sign up with Facebook" aria-label="Sign up with Facebook">
          <svg class="w-4 h-4 fill-[#1877F2]" viewBox="0 0 24 24">
            <path
              d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Login Navigation Link -->
    <div class="text-center text-xs text-stone-500 pt-2 border-t border-stone-100 dark:border-stone-800">
      Already have a guest account?
      <a href="login.html" class="font-bold text-emerald-800 dark:text-emerald-400 hover:underline ml-1">Log In Here</a>
    </div>
  </div>
</div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Password visibility toggles
    document.querySelectorAll('.btn-pwd-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-target');
        const input = document.getElementById(targetId);
        if (input) {
          const isPwd = input.type === 'password';
          input.type = isPwd ? 'text' : 'password';
          btn.innerHTML = isPwd ? '<i data-lucide="eye-off" class="w-4 h-4"></i>' : '<i data-lucide="eye" class="w-4 h-4"></i>';
          if (window.lucide) lucide.createIcons();
        }
      });
    });

    // Sign up form submission
    document.getElementById('signup-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const p1 = document.getElementById('signup-password').value;
      const p2 = document.getElementById('signup-confirm-password').value;
      if (p1 !== p2) {
        SylvanToast.show('Password Mismatch', 'Passwords do not match. Please verify.', 'error');
        return;
      }

      const newUser = {
        name: `${document.getElementById('signup-fname').value} ${document.getElementById('signup-lname').value}`,
        email: document.getElementById('signup-email').value,
        phone: document.getElementById('signup-phone').value,
        avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80",
        memberSince: "November 2026",
        membershipLevel: "Countryside Pioneer",
        address: "Woodstock, VT"
      };

      SylvanStore.saveUser(newUser);
      SylvanToast.show('Account Created', `Welcome to SYLVAN, ${newUser.name}! Opening your dashboard...`, 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 800);
    });

    window.handleSocialSignup = function (provider) {
      SylvanToast.show(`${provider} Connected`, `Creating guest account with ${provider} profile...`, 'info');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 800);
    };
  </script>
</body>

</html>
